name: Synthetic tests (no LINE access)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python-version: ["3.11", "3.12"]
    env:
      # Never inherit the live-test opt-in from runner environment settings.
      PYTEST_ADDOPTS: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked runtime and test dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-test.txt
      - name: Run synthetic tests only
        # No --run-live-line, real settings, account DB, keys, UI automation,
        # or artifact uploads. This does not validate Windows LINE behavior.
        run: python -m pytest -m "not integration" --cov --cov-report=term-missing -q
